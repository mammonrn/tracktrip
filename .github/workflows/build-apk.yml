name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        # Verifies gradle-wrapper.jar matches a known-good release, so a
        # tampered wrapper can't execute arbitrary code in CI.
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Decode debug keystore
        id: debug_keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        # Without a pinned keystore, AGP generates a throwaway one per runner,
        # so every build is signed with a different, unregistered certificate
        # and Google Sign-In fails. The build is still allowed to proceed —
        # the APK is fine for anything that doesn't involve Google Sign-In —
        # but the run is annotated so it's obvious from the summary.
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            if [ ! -s "$RUNNER_TEMP/debug.keystore" ]; then
              echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is set but did not decode to a file. Re-generate it with 'base64 -w0' (Linux/macOS) or 'certutil -encode' (Windows) and update the secret."
              exit 1
            fi
            echo "path=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing debug build with the pinned keystore from ANDROID_DEBUG_KEYSTORE_BASE64."

            # Fingerprint the decoded bytes. A keystore that reads locally but
            # not here points at the payload being altered somewhere between
            # the developer machine and the secret; comparing this hash against
            # the source file settles that in one step. Byte count alone does
            # not, since an in-place character change keeps the size identical.
            SIZE="$(stat -c%s "$RUNNER_TEMP/debug.keystore")"
            SHA256="$(sha256sum "$RUNNER_TEMP/debug.keystore" | cut -d' ' -f1)"
            echo "Decoded keystore SHA-256: $SHA256"
            {
              echo "### Decoded debug keystore"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Size | \`$SIZE\` bytes |"
              echo "| SHA-256 | \`$SHA256\` |"
              echo ""
              echo "Compare against the source file on the developer machine — the two must match exactly:"
              echo ""
              echo '```powershell'
              echo 'Get-FileHash "$env:USERPROFILE\.android\debug.keystore" -Algorithm SHA256'
              echo '```'
              echo ""
              echo '```bash'
              echo 'sha256sum ~/.android/debug.keystore'
              echo '```'
              echo ""
              echo "A different hash means the bytes changed on the way into the secret (clipboard, editor, or stray whitespace/newline), not that the keystore itself is bad."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Gradle will generate a throwaway debug keystore with a random SHA-1, so GOOGLE SIGN-IN WILL NOT WORK in this APK. See android/README.md."
          fi

      - name: Verify decoded keystore
        if: steps.debug_keystore.outputs.path != ''
        env:
          KEYSTORE_PATH: ${{ steps.debug_keystore.outputs.path }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        # Opening the keystore here rather than letting AGP fail turns a 40-line
        # Gradle stack trace into a one-line cause, and separates the failures
        # that look identical from outside: corrupted base64, wrong store
        # password, and wrong *key* password — which is a genuinely different
        # thing, since a keystore can use one password for the store and
        # another for the key inside it.
        run: |
          PASS="${DEBUG_KEYSTORE_PASSWORD:-android}"
          ALIAS="${DEBUG_KEY_ALIAS:-androiddebugkey}"
          KEYPASS="${DEBUG_KEY_PASSWORD:-$PASS}"
          echo "Decoded keystore: $(stat -c%s "$KEYSTORE_PATH") bytes"

          # Format/algorithm details, so a keystore that reads on a developer
          # machine but not here can be compared without guesswork.
          echo "--- environment ---"
          java -version 2>&1 | head -1
          echo "--- keystore format ---"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASS" 2>/dev/null \
            | grep -iE 'Keystore type|Keystore provider' || echo "(could not read type)"
          if command -v openssl >/dev/null; then
            echo "--- encryption algorithms (openssl) ---"
            openssl pkcs12 -in "$KEYSTORE_PATH" -info -nokeys -passin "pass:$PASS" 2>&1 \
              | grep -iE 'PKCS7|Encrypted|MAC:' | head -4 || echo "(not PKCS12, or openssl could not parse it)"
          fi
          echo "--- checks ---"

          # keytool reports failures on stdout, not stderr, so both streams have
          # to be captured together or the classification below sees nothing.
          if keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$PASS" >/tmp/ks.out 2>&1; then
            echo "Keystore opened successfully. Aliases and fingerprints:"
            grep -E 'Alias name:|SHA1:' /tmp/ks.out || true
            if ! grep -qi "Alias name: $ALIAS" /tmp/ks.out; then
              echo "::warning::No alias named '$ALIAS' in this keystore. Set ANDROID_DEBUG_KEY_ALIAS to one of the aliases listed above."
            fi

            # The store password only unlocks the keystore's listing. Signing
            # needs the private key itself, which can carry a different
            # password — and that failure otherwise surfaces from AGP as the
            # misleading "keystore password was incorrect". -certreq is the
            # cheapest read that actually touches the key.
            if keytool -certreq -alias "$ALIAS" -keystore "$KEYSTORE_PATH" \
                 -storepass "$PASS" -keypass "$KEYPASS" >/dev/null 2>/tmp/key.err; then
              echo "Private key '$ALIAS' unlocked successfully; signing will work."
              exit 0
            fi

            echo "keytool could not unlock the private key:"
            grep -iv '^Picked up' /tmp/key.err | head -3
            echo "::error::The keystore opened and its fingerprint is correct, but the private key '$ALIAS' could not be unlocked with the configured key password. NOTE: 'keytool -list' does NOT verify the key password (it ignores -keypass entirely), so a passing -list on a developer machine does not prove the key password. Verify locally with a command that actually reads the key: keytool -certreq -alias $ALIAS -keystore debug.keystore -storepass $PASS -keypass $PASS  --  If that also fails, re-export the keystore with matching passwords: keytool -importkeystore -srckeystore debug.keystore -srcstorepass $PASS -destkeystore debug-fixed.p12 -deststoretype PKCS12 -deststorepass $PASS -destkeypass $PASS (same key, so the SHA-1 does not change)"
            exit 1
          fi

          echo "keytool could not open the keystore:"
          grep -v '^Picked up' /tmp/ks.out | head -5
          if grep -qi 'password was incorrect\|failed to decrypt\|BadPadding\|UnrecoverableKey' /tmp/ks.out; then
            echo "::error::The keystore decoded fine, but the password is wrong. The build defaults to the standard debug password 'android'. If this keystore uses a different one (a release keystore always does), add it as the ANDROID_DEBUG_KEYSTORE_PASSWORD secret - and double-check that ~/.android/debug.keystore was exported, not the release keystore."
          elif grep -qi 'Unrecognized keystore format\|Invalid keystore format\|DerInputStream\|not a valid' /tmp/ks.out; then
            echo "::error::The decoded file is not a keystore, so ANDROID_DEBUG_KEYSTORE_BASE64 is corrupted or truncated. Re-export it as ONE unbroken line with no BEGIN/END header lines."
          else
            echo "::error::Could not open the decoded keystore; see the keytool output above."
          fi
          exit 1

      - name: Run unit tests
        working-directory: android
        # Before the APK, so a broken test stops the build rather than being
        # discovered after an artifact has been published. These are plain JVM
        # tests — no emulator, no device — and they are the only automated
        # check the Android side has.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        env:
          # Empty when no secret is configured, which makes build.gradle.kts
          # fall back to AGP's default debug signing.
          DEBUG_KEYSTORE_PATH: ${{ steps.debug_keystore.outputs.path }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        # Release signing is deliberately not done here: that keystore is kept
        # off GitHub entirely. See android/README.md.
        run: ./gradlew assembleDebug --stacktrace

      - name: Report signing certificate
        # The fingerprint that must be registered in Google Cloud Console for
        # this build's package name. Printed on every run so a mismatch is
        # visible without downloading and inspecting the APK by hand.
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE 'DN:|SHA-1 digest' | tee /tmp/certs.txt
          SHA1="$(grep -im1 'SHA-1 digest' /tmp/certs.txt | sed 's/.*: //' | tr -d ' \r')"
          COLONED="$(echo "$SHA1" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')"
          {
            echo "### Debug APK signing certificate"
            echo ""
            echo "\`\`\`"
            echo "SHA-1: $COLONED"
            echo "\`\`\`"
            echo ""
            if [ -n "${{ steps.debug_keystore.outputs.path }}" ]; then
              echo "Signed with the **pinned** keystore from \`ANDROID_DEBUG_KEYSTORE_BASE64\`."
              echo "Google Sign-In works only if this fingerprint is registered in Google Cloud"
              echo "Console for package \`app.ptrip.tracktrip.debug\`."
            else
              echo "⚠️ Signed with a **throwaway auto-generated** keystore — this fingerprint"
              echo "changes on every run, so **Google Sign-In will not work** in this APK."
              echo "Set the \`ANDROID_DEBUG_KEYSTORE_BASE64\` secret to fix it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tracktrip-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
