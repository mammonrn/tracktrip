# Reverse proxy for the trip-tracker API (api.ptrip.app).
#
# Deploy by symlinking this file into /etc/nginx/sites-enabled/ — see
# DEPLOY.md. This does not touch any other site already configured on
# the box.
#
# This is a port-80-only config on purpose: run
#   sudo certbot --nginx -d api.ptrip.app
# after this site is enabled and nginx has been reloaded. Certbot edits
# this file in place to add the port 443 / TLS server block and the
# HTTP -> HTTPS redirect.
#
# If PORT in .env is not 4100, update the proxy_pass line below to match.

server {
    listen 80;
    listen [::]:80;
    server_name api.ptrip.app;

    # Rider avatars, served straight off disk.
    #
    # `root` (not `alias`) with a directory named /uploads on disk, so the URI
    # /uploads/avatars/x.jpg maps to <root>/uploads/avatars/x.jpg. Point it at
    # the parent of the uploads directory the app writes to — with the default
    # UPLOADS_DIR of /home/DEPLOY_USER/tracktrip/uploads, that is
    # /home/DEPLOY_USER/tracktrip. Change both together or images 404.
    #
    # nginx's worker user (www-data on Debian/Ubuntu) needs +x on every
    # directory in that path and +r on the files. The app writes them 0644.
    location /uploads/ {
        root /home/DEPLOY_USER/tracktrip;

        # Read-only, and only the two formats the upload endpoint accepts.
        # Anything else under this path is not something we put there.
        limit_except GET HEAD {
            deny all;
        }
        location ~* ^/uploads/avatars/[^/]+\.(jpg|png)$ {
            root /home/DEPLOY_USER/tracktrip;
            expires 30d;
            add_header Cache-Control "public, immutable";
            # Filenames are random UUIDs, so a cached avatar is never the
            # wrong one — a new upload is a new name.
            try_files $uri =404;
        }
        return 404;
    }

    # The live position feed. Its own block for one reason: proxy_read_timeout.
    #
    # nginx's default is 60 seconds of silence before it closes a proxied
    # connection, which is right for a request and wrong for a socket — a group
    # stopped for lunch produces no position updates, and the feed would be cut
    # every minute and reconnected. Both ends ping well inside an hour (the
    # server every 30s, the app every 20s), so this is a backstop rather than
    # the thing keeping the connection open.
    #
    # Raised here and not on `location /`, where an hour-long read timeout
    # would mean an ordinary request that hangs ties up a worker for an hour.
    location /ws {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Use the literal loopback IP, not "localhost": localhost can resolve
        # to ::1 (IPv6) first, while the app binds to 127.0.0.1 only, which
        # produces confusing 502s.
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # Upgrades are forwarded here too, so a socket still works if the
        # dedicated /ws block above is ever removed — it just loses the long
        # read timeout that keeps a quiet connection alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve the real client IP. Required so the app's per-IP rate
        # limiting on /auth/* sees each caller separately instead of
        # treating every request as coming from nginx's own address.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
