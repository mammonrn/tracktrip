# Reverse proxy for the trip-tracker API (api.ptrip.app).
#
# Deploy by symlinking this file into /etc/nginx/sites-enabled/ — see
# DEPLOY.md. This does not touch any other site already configured on
# the box.
#
# This is a port-80-only config on purpose: run
#   sudo certbot --nginx -d api.ptrip.app
# after this site is enabled and nginx has been reloaded. Certbot edits
# this file in place to add the port 443 / TLS server block and the
# HTTP -> HTTPS redirect.
#
# If PORT in .env is not 4100, update the proxy_pass line below to match.

server {
    listen 80;
    listen [::]:80;
    server_name api.ptrip.app;

    location / {
        proxy_pass http://localhost:4100;
        proxy_http_version 1.1;

        # WebSocket support (the live position feed uses `ws` on this
        # same port).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve the real client IP. Required so the app's per-IP rate
        # limiting on /auth/* sees each caller separately instead of
        # treating every request as coming from nginx's own address.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
