# The public web host, ptrip.app.
#
# Separate from nginx-api.ptrip.app.conf and separate from the API: this host
# proxies nothing and holds no database. It exists to serve two static things
# that have to come from the *apex* domain, because that is the domain the
# Android app claims in its intent filter:
#
#   /.well-known/assetlinks.json   what makes an invite link open the app
#   /join/CODE                     what a phone WITHOUT the app lands on
#
# Deploy by symlinking this file into /etc/nginx/sites-enabled/ — see DEPLOY.md.
# It does not touch any other site already configured on the box.
#
# ---------------------------------------------------------------------------
# DNS FIRST, THEN CERTBOT. ptrip.app needs its own certificate — the one on
# api.ptrip.app does not cover it, and they are different hostnames rather than
# a wildcard. Certbot proves control of the name by fetching a file over HTTP
# from whatever ptrip.app currently resolves to, so:
#
#   1. Point ptrip.app (A/AAAA) at this server and wait for it to resolve
#      here — `dig +short ptrip.app` must return this box's address.
#   2. Enable this site and reload nginx.
#   3. sudo certbot --nginx -d ptrip.app
#
# Running certbot before DNS has moved fails, and repeated failures hit Let's
# Encrypt's rate limit for the name, so check step 1 rather than retrying.
#
# This is a port-80-only config on purpose, the same as the API's. Certbot
# clones this server block into a port-443 one with the certificate attached,
# and turns what is left on port 80 into an HTTP -> HTTPS redirect. Every
# location below therefore ends up in the TLS block too, which is the block
# that matters: Android only ever requests the https URL.
#
# NO REDIRECTS ON THIS HOST. Not www -> apex, not apex -> www, not a trailing
# slash canonicalisation. Android treats anything other than HTTP 200 on
# https://ptrip.app/.well-known/assetlinks.json as an error and does not follow
# 301 or 302, so a redirect there does not break loudly — verification simply
# never succeeds, and invite links keep opening a browser. That is why
# server_name below is the apex and nothing else: claiming www here would
# invite exactly the canonical-redirect rule that breaks it.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name ptrip.app;

    # Where the two static files live. Create it and copy deploy/www/join.html
    # and deploy/assetlinks.json into place — DEPLOY.md has the commands.
    root /var/www/ptrip.app;

    # Digital Asset Links. This is the file Android fetches to decide whether
    # this app may claim https://ptrip.app/join/... as a verified App Link.
    #
    # `location =` is an exact match, so nothing else can shadow it and it
    # cannot pick up a trailing-slash rewrite.
    #
    # The empty `types` block plus `default_type` forces application/json
    # rather than relying on mime.types being present and unedited. Google's
    # statement-list documentation requires that content type; a file served as
    # text/plain or octet-stream is treated as no statement list at all.
    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;

        # Verification is retried on install and on update, so this does not
        # need to be uncacheable — but it does need to be short enough that
        # adding a build's fingerprint takes effect the same day. `add_header`
        # alone rather than `expires`, which would emit a second, differently
        # worded Cache-Control alongside it.
        add_header Cache-Control "public, max-age=300";

        # =404 rather than falling through: a missing file must be a plain
        # 404 that says so, not the join page or a directory listing.
        try_files $uri =404;
    }

    # The invite landing page, for a phone that does not have the app.
    #
    # `^~` so this wins over any regex location added later, and one page for
    # every code rather than a page per code: this host has no database and no
    # API access, so it cannot tell a real code from a made-up one. Deciding
    # that is the app's job and then the server's. All this page owes the
    # visitor is "you were invited to a trip, here is the app".
    #
    # The code itself is read out of the URL by the page, so nothing here has
    # to know the format.
    location ^~ /join/ {
        try_files /join.html =404;
    }

    # The privacy policy. Google Play stores this as a link and re-checks it,
    # so a 404 here is a listing problem rather than only a broken page.
    #
    # `location =` is an exact match, for the same reason assetlinks.json uses
    # one: nothing else can shadow it and it cannot pick up a trailing-slash
    # rewrite. A prefix match would buy nothing — unlike /join/, there is no
    # variable part of the path to absorb.
    #
    # No `types`/`default_type` here, deliberately. That block exists on
    # assetlinks.json because Google's statement-list parser rejects anything
    # not served as application/json; this is an ordinary HTML page and the
    # stock mime.types already maps .html to text/html.
    location = /privacy.html {
        try_files $uri =404;
    }

    # Nothing else is served from this host yet. An explicit 404 rather than a
    # redirect to the API or to a placeholder, so that adding a real site later
    # is adding locations above this line and not undoing a rule.
    #
    # Certbot inserts its own /.well-known/acme-challenge/ location while it
    # runs, so this does not get in the way of issuing or renewing.
    location / {
        return 404;
    }
}
